[project]
name = "pawnllm"
version = "0.1.0"
description = "Minimal and educational LLM trained on the tinystories dataset"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch",
    "einops",
    "sentencepiece",
    "tqdm",
    "datasets",
    "python-chess>=1.999",
    "zstandard>=0.25.0",
    "numpy>=2.2.6",
    "requests>=2.32",
]

[tool.uv]
package = false
